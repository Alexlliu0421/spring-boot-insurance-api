<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>修改投保申請</title>
</head>

<body>
    <h1>修改投保申請</h1>

    <form>
        <!-- 提示：對應 PolicyApplicationUpdateDTO 的欄位 -->
        <label>狀態：
            <select id="status">
                <option value="PENDING">待審核</option>
                <option value="APPROVED">核准</option>
                <option value="REJECTED">拒絕</option>
            </select>
        </label><br>
        <label>審核人：<input type="text" id="reviewedBy"></label><br>
        <label>拒絕原因：<input type="text" id="rejectionReason"></label><br>
        <button type="button" onclick="submitForm()">送出</button>
        <button type="button" onclick="location.href='index.html'">取消</button>
    </form>

    <script>
        // 提示1：從 URL 取得 id
        // window.location.search → ?id=APP001
        // new URLSearchParams(...).get('id') → APP001
        const id = new URLSearchParams(window.location.search).get('id');

        // 提示2：頁面載入時先查詢現有資料填入表單
        // 呼叫 GET /api/policy-application/{id}
        fetch(`http://localhost:8080/api/policy-application/${id}`)
            .then(res => res.json())
            .then(result => {
                // 填入表單資料
                document.getElementById('status').value = result.data.applicationStatus;
                document.getElementById('reviewedBy').value = result.data.reviewedBy || '';
                document.getElementById('rejectionReason').value = result.data.rejectionReason || '';
            });

        function submitForm() {
            const status = document.getElementById('status').value;
            const reviewedBy = document.getElementById('reviewedBy').value;
            const rejectionReason = document.getElementById('rejectionReason').value;
            if (status === 'REJECTED' && rejectionReason === '') {
                alert('拒絕時必須填寫拒絕原因');
                return;
            }
            fetch(`http://localhost:8080/api/policy-application/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status, reviewedBy, rejectionReason })
            }).then(() => location.href = 'index.html');
        }
    </script>
</body>

</html>
