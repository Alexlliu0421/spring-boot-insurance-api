<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>新增投保申請</title>
</head>

<body>
    <h1>新增投保申請</h1>

    <!-- 提示：對應 PolicyApplicationReqDTO 的欄位 -->
    <form>
        <label>身分證號：<input type="text" id="applicantIdNo"></label><br>
        <label>姓名：<input type="text" id="applicantName"></label><br>
        <label>性別：
            <select id="applicantGender">
                <option value="MALE">男</option>
                <option value="FEMALE">女</option>
            </select>
        </label><br>
        <label>生日：<input type="date" id="applicantBirthdate"></label><br>
        <label>與被保人關係：<input type="text" id="relationshipToInsured"></label><br>
        <label>商品代碼：<input type="text" id="productCode"></label><br>
        <label>保額：<input type="number" id="sumInsured"></label><br>
        <label>年繳保費：<input type="number" id="annualPremium"></label><br>
        <label>聯絡電話：<input type="text" id="contactPhone"></label><br>
        <label>建立人：<input type="text" id="createdBy"></label><br>
        <button type="button" onclick="submitForm()">送出</button>
        <button type="button" onclick="location.href='index.html'">取消</button>
    </form>

    <script>
        function submitForm() {
            // 提示：用 fetch 呼叫 POST /api/policy-application
            const applicantIdNo = document.getElementById('applicantIdNo').value;
            const applicantName = document.getElementById('applicantName').value;
            const applicantGender = document.getElementById('applicantGender').value;
            const applicantBirthdate = document.getElementById('applicantBirthdate').value;
            const relationshipToInsured = document.getElementById('relationshipToInsured').value;
            const productCode = document.getElementById('productCode').value;
            const sumInsured = document.getElementById('sumInsured').value;
            const annualPremium = document.getElementById('annualPremium').value;
            const contactPhone = document.getElementById('contactPhone').value;
            const createdBy = document.getElementById('createdBy').value;

            // 提示1：身分證號不能空白
            if (applicantIdNo === '') {
                alert('請輸入身分證號');
                return;
            }

            // 提示2：姓名不能空白
            if (applicantName === '') {
                alert('請輸入姓名');
                return;
            }

            // 提示3：保額不能小於等於 0
            if (sumInsured <= 0) {
                alert('保額必須大於 0');
                return;
            }

            // 提示4：年繳保費不能小於等於 0
            if (annualPremium <= 0) {
                alert('年繳保費必須大於 0');
                return;
            }

            fetch('http://localhost:8080/api/policy-application', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    applicantIdNo,
                    applicantName,
                    applicantGender,
                    applicantBirthdate,
                    relationshipToInsured,
                    productCode,
                    sumInsured,
                    annualPremium,
                    contactPhone,
                    createdBy
                })
            })
                .then(res => res.json())
                .then(result => {
                    // 成功後跳回 index.html
                    location.href = 'index.html';
                });
        }
    </script>
</body>

</html>
